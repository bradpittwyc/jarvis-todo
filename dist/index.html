<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#1b1b1b" />
  <meta name="description" content="A focused, fluid personal task manager" />
  <title>Todo</title>
  <link rel="icon" type="image/svg+xml" href="../build/icon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="titlebar">
      <button class="brand" data-action="home" aria-label="Todo home"><span class="brand-windows-icon" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>Todo</span></button>
    </header>
    <div class="workspace">
      <aside class="sidebar" id="sidebar"></aside>
      <main class="main" id="main"></main>
      <aside class="detail-panel" id="detailPanel" aria-label="Task details"></aside>
      <aside class="suggestions-panel" id="suggestionsPanel" aria-label="Suggestions"></aside>
    </div>
    <div class="toast" id="toast" role="status"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
